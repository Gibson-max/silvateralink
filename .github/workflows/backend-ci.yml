name: Backend checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [feature/admin-backend]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install dependencies
        working-directory: backend
        run: npm install --ignore-scripts
      - name: Check serverless entrypoint syntax
        run: node --check 'api/[...path].js'
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: npm run check
